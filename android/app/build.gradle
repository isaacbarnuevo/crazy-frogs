plugins {
    id 'com.android.application'
}

android {
    namespace 'com.battlefrogs.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.battlefrogs.game"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero external dependencies - uses pure core Android framework
}
